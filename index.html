<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1B2E" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icones/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seju." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Painel de Gestão Integrada · SEJU-PR</title>
    <meta name="description" content="Frotas, chamados, salas, diárias e ramais da Secretaria da Justiça e Cidadania do Paraná num só lugar." />
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased ">
    <script>
      // Aplica o tema escolhido antes de desenhar a página (sem piscar claro).
      try {
        if (localStorage.getItem('seju_tema') === 'escuro') {
          document.documentElement.classList.add('dark');
          document.body.classList.add('theme-midnight');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
