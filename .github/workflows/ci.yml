name: CI/CD · SEJU Gestão Integrada

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qualidade-e-build:
    name: Validação de Qualidade, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Limpas
        run: npm ci

      - name: Executar Validação de Tipos TypeScript
        run: npx tsc -b

      - name: Executar Suíte de Testes Unitários de Regras Críticas
        run: npm test

      - name: Compilar Bundle de Produção (Vite Build)
        run: npm run build

      - name: Verificar Integridade do Artefato de Produção
        run: |
          test -f dist/index.html || exit 1
          echo "Artefato de produção compilado com sucesso."

  navegador:
    name: Testes no navegador (fluxos e acessibilidade)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Limpas
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes de ponta a ponta
        run: npx playwright test

      - name: Guardar relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  banco-de-dados:
    name: Testes do banco (migrations, RLS e regras)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar cliente psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client

      - name: Aplicar migrations e rodar os testes SQL
        run: bash supabase/tests/run.sh
